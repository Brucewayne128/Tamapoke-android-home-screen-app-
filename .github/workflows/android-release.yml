name: Android APK release

# Builds the launcher and attaches the APK to a GitHub Release, so it can be
# downloaded straight from a phone (CI artifacts need a GitHub login and come
# zipped).
on:
  push:
    paths:
      - "android/**"
      - "tools/sdcard/mons/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Check the sprites made it into the APK
        run: |
          n=$(unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -c 'assets/mons/p.*\.bin')
          echo "$n sprite files in the APK"
          test "$n" -ge 300
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TamaPokeHome.apk
          tag="launcher-latest"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" TamaPokeHome.apk \
            --target "$GITHUB_SHA" \
            --title "TamaPoke Home (Android launcher)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Download TamaPokeHome.apk on your phone and open it to install." \
            --prerelease
